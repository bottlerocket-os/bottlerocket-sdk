[package]
name = "bottlerocket-license-scan"
version = "0.1.0"
description = "Collects and identifies licenses of Rust and Golang dependencies"
license = "Apache-2.0 OR MIT"
authors = ["iliana destroyer of worlds <iweller@amazon.com>"]
repository = "https://github.com/bottlerocket-os/bottlerocket-sdk"
edition = "2018"
keywords = ["license", "spdx", "ci"]
readme = "README.md"

[dependencies]
anyhow = "1"
askalono = "0.5"
cargo_metadata = "0.23"
ignore = "0.4"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
spdx = "0.13"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
toml = "1"
twox-hash = { version = "1", default-features = false }
walkdir = "2"

[dev-dependencies]
maplit = "1"
